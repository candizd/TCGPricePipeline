[project]
name = "tcg-price-pipeline"
version = "0.1.0"
description = "TCG (Pokemon & One Piece, JP/EN) fiyat batch ETL pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",        # API çekme (sync+async, modern requests alternatifi)
    "pydantic>=2.7",      # şema doğrulama / entity model
    "python-dotenv>=1.0", # .env yükleme
    "boto3>=1.34",        # MinIO (S3 uyumlu) erişimi
]

[dependency-groups]
dev = [
    "ruff>=0.5",          # lint + format
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_pipeline"]
